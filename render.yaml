databases:
  - name: auth-django-db
    plan: free
    databaseName: auth_django
    user: auth_django

services:
  - type: web
    name: auth-django
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn Auth.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: WEB_CONCURRENCY
        value: "4"
      - key: DATABASE_URL
        fromDatabase:
          name: auth-django-db
          property: connectionString
      # RENDER_EXTERNAL_HOSTNAME is set automatically by Render and is
      # already trusted in settings.py — no ALLOWED_HOSTS entry needed
      # unless you attach a custom domain, in which case add it below.
      # - key: ALLOWED_HOSTS
      #   value: "yourdomain.com"
