{% extends 'base.html' %}
{% block title %}Log In - Premium Portal{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="page-header">
            <div class="header-text">
                <h1>Log In</h1>
                <p>Welcome back</p>
            </div>
        </div>

        <form id="login-form">
            {% csrf_token %}
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input class="form-input" type="email" id="email" name="email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-input" type="password" id="password" name="password" required
                        autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-primary" id="btn-login" style="margin-top: 1rem;">
                <span>Log In</span>
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{% url 'signup' %}">Sign Up</a>
        </div>
    </div>
</div>

<script>
    $("#login-form").submit(function (e) {
        e.preventDefault();

        var csrftoken = $("input[name='csrfmiddlewaretoken']").val();

        var btn = $("#btn-login");
        btn.prop('disabled', true).find('span').text("Logging In...");

        $.ajax({
            url: "{% url 'login' %}",
            method: 'POST',
            headers: {
                "X-CSRFToken": csrftoken
            },
            data: {
                email: $("#email").val(),
                password: $("#password").val()
            },
            success: function (response) {
                if (response.status === 'success') {
                    window.location.href = response.redirect_url;
                }
            },
            error: function (xhr) {
                console.log(xhr.responseText);
            }
        });
    });
</script>
{% endblock %}
